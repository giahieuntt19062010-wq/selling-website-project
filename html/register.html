<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="../css/style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../html/index.html">Trang chủ</a></li>
            <li><a href="../html/login.html" class="btn-outline">Đăng nhập</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-form">
            <h2>ĐĂNG KÝ</h2>
            <form id="registerForm">
                <input type="text" id="regName" placeholder="Tên của bạn" required>
                <input type="email" id="regEmail" placeholder="Gmail" required>
                <input type="password" id="regPass" placeholder="Mật khẩu" required>
                <button type="submit">HOÀN TẤT</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                Đã có tài khoản? <a href="../html/login.html">Đăng nhập ngay</a>
            </p>
        </div>
    </div>

    <script type="module" src="../js/script.js"></script>
</body>
</html>
