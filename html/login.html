<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="../css/style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../html/index.html">Trang chủ</a></li>
            <li><a href="../html/register.html" class="btn-fill">Đăng ký</a></li>
        </ul>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-form">
            <h2>ĐĂNG NHẬP</h2>
            <form id="loginForm">
                <input type="email" id="logEmail" placeholder="Gmail" required>
                <input type="password" id="logPass" placeholder="Mật khẩu" required>
                <button type="submit">ĐĂNG NHẬP</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                Chưa có tài khoản? <a href="../html/register.html">Đăng ký tại đây</a>
            </p>
        </div>
    </div>

    <script type="module" src="../js/script.js"></script>
</body>
</html>
