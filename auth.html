<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản Dell Store - Hệ thống chính hãng</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Dell_logo_2016.svg" alt="Dell Logo">
                <div class="auth-tabs">
                    <button id="tab-login" class="tab-btn active" onclick="showForm('login')">ĐĂNG NHẬP</button>
                    <button id="tab-register" class="tab-btn" onclick="showForm('register')">ĐĂNG KÝ</button>
                </div>
            </div>

            <div id="login-section" class="auth-content active">
                <form id="login-form">
                    <div class="input-field">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="l-user" placeholder="Nhập tên đăng nhập của bạn" required>
                    </div>
                    <div class="input-field">
                        <label>Mật khẩu</label>
                        <input type="password" id="l-pass" placeholder="Nhập mật khẩu" required>
                    </div>
                    <div class="form-options">
                        <label><input type="checkbox"> Ghi nhớ đăng nhập</label>
                        <a href="#">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="btn-main-blue">VÀO CỬA HÀNG</button>
                </form>
            </div>

            <div id="register-section" class="auth-content">
                <form id="register-form">
                    <div class="input-field">
                        <label>Tên đăng nhập (Username)</label>
                        <input type="text" id="r-user" placeholder="Ví dụ: delluser2026" required>
                    </div>
                    <div class="input-field">
                        <label>Địa chỉ Gmail</label>
                        <input type="email" id="r-email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="input-field">
                        <label>Mật khẩu mới</label>
                        <input type="password" id="r-pass" placeholder="Tối thiểu 8 ký tự" required minlength="8">
                    </div>
                    <div class="policy-text">
                        Bằng cách nhấn đăng ký, bạn đồng ý với các <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của chúng tôi.
                    </div>
                    <button type="submit" class="btn-main-blue">TẠO TÀI KHOẢN NGAY</button>
                </form>
            </div>

            <div class="auth-footer">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
